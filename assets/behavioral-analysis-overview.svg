<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-label="ARTEX and Proxy IP Behavioral Analysis workflow infographic"><defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#eaf4ff}.title{font-size:42px;font-weight:700}.sub{font-size:21px;fill:#a2b9d5}.header{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:16px;fill:#a2b9d5}.panel{fill:#172e50;stroke:#447da6;stroke-width:2}.pill{fill:#214369;stroke:#56acd3}.arrow{fill:#64d7ee;font-size:30px}</style></defs><rect width="1400" height="860" fill="#0a152c"/><text x="52" y="72" class="title">AI-Agent &amp; Proxy IP Behavioral Analysis</text><text x="52" y="108" class="sub">Two independent research tracks, one evidence-based detection workflow</text><rect x="50" y="155" rx="20" width="620" height="265" class="panel"/><text x="80" y="204" class="header">Track A — Proxy IP Sequences</text><text x="80" y="250" class="body">Ordered source-IP access logs</text><text x="80" y="287" class="body">→ Candidate repeated rounds / pools</text><text x="80" y="324" class="body">→ Jaccard: similarity of IP membership</text><text x="80" y="361" class="body">→ Kendall tau: similarity of IP order</text><rect x="730" y="155" rx="20" width="620" height="265" class="panel"/><text x="760" y="204" class="header">Track B — ARTEX Tool Behavior</text><text x="760" y="250" class="body">Web fetch / content conversion workflow</text><text x="760" y="287" class="body">JavaScript GET requests and retries</text><text x="760" y="324" class="body">Response → follow-up request sequence</text><text x="760" y="361" class="small">Server logs cannot directly see local grep or Markdown conversion</text><text x="695" y="467" text-anchor="middle" class="arrow">↓</text><rect x="185" y="502" rx="20" width="1030" height="138" class="panel"/><text x="700" y="548" text-anchor="middle" class="header">Correlate Observables, Not Just Tools or IPs</text><text x="700" y="590" text-anchor="middle" class="body">Sequence similarity + request context + timing + response behavior</text><text x="695" y="676" text-anchor="middle" class="arrow">↓</text><rect x="185" y="711" rx="20" width="1030" height="100" class="pill"/><text x="700" y="753" text-anchor="middle" class="header">Triage anomalies and potential manual follow-up</text><text x="700" y="782" text-anchor="middle" class="small">Human attribution and campaign linkage require independent evidence</text></svg>